<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dad's Luxury Car Quiz</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f0f; color: #fff; margin: 0; padding: 20px; line-height: 1.5; }
  .container { max-width: 480px; margin: 0 auto; background: #1a1a1a; border-radius: 16px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  h1 { font-size: 24px; margin: 0 0 8px; }
  .subtitle { color: #aaa; margin-bottom: 24px; font-size: 14px; }
  .question { font-size: 20px; margin-bottom: 20px; }
  .options { display: flex; flex-direction: column; gap: 12px; }
  button, .option { background: #2a2a2a; border: 1px solid #333; color: #fff; padding: 16px; border-radius: 12px; font-size: 16px; cursor: pointer; text-align: left; transition: all 0.2s; }
  button:hover, .option:hover { background: #333; border-color: #555; }
  button.primary { background: #0066cc; border-color: #0066cc; font-weight: 600; }
  .progress { height: 4px; background: #333; border-radius: 2px; margin-bottom: 20px; }
  .progress-bar { height: 100%; background: #0066cc; width: 0%; transition: width 0.3s; }
  .result-card { background: #222; border-radius: 12px; padding: 16px; margin-bottom: 16px; border-left: 4px solid #0066cc; }
  .result-card h3 { margin: 0 0 8px; font-size: 18px; }
  .result-card p { margin: 0; color: #ccc; font-size: 14px; }
  .hidden { display: none; }
  .restart { margin-top: 20px; width: 100%; }
</style>
</head>
<body>
<div class="container">
  <div class="progress"><div class="progress-bar" id="progress"></div></div>
  <h1>Find Your Next Luxury Car</h1>
  <p class="subtitle">Quick quiz for a reliable, modern-feeling luxury car with strong value.</p>
  
  <div id="quiz">
    <div class="question" id="question">Loading...</div>
    <div class="options" id="options"></div>
  </div>
  
  <div id="results" class="hidden">
    <h2>Your Top Matches</h2>
    <div id="results-list"></div>
    <button class="primary restart" onclick="restart()">Start Over</button>
  </div>
</div>

<script>
const questions = [
  {
    q: "What's your max budget (out-the-door)?",
    options: ["Under $35k", "$35k – $45k", "$45k – $55k", "$55k+"]
  },
  {
    q: "Preferred body style?",
    options: ["Sedan", "Coupe", "SUV", "No preference"]
  },
  {
    q: "How important is AWD?",
    options: ["Must have", "Nice to have", "RWD is fine"]
  },
  {
    q: "Powertrain preference?",
    options: ["Strong inline-6 or V6 preferred", "Open to a proven V8", "No strong preference"]
  },
  {
    q: "Top priority?",
    options: ["Maximum value / depreciation", "Reliability above all", "Highway comfort & quiet", "Feels brand new / modern tech"]
  },
  {
    q: "Must-have features? (pick the most important)",
    options: ["Air suspension", "Ventilated / massage seats", "Adaptive cruise / driver assists", "Premium audio (Burmester etc.)", "None in particular"]
  },
  {
    q: "Max mileage you're comfortable with?",
    options: ["Under 30k", "30k – 50k", "50k – 70k", "Higher is okay if maintained"]
  },
  {
    q: "Oldest year you'd consider?",
    options: ["2021+", "2019+", "2017+", "Flexible if it feels modern"]
  }
];

const cars = [
  {
    name: "2021+ Mercedes E450 4MATIC",
    why: "New M256 inline-6 mild-hybrid. Excellent generation-gap value. Smooth, powerful, and the right engine to buy.",
    tags: ["sedan", "awd", "i6", "value", "comfort", "2021"]
  },
  {
    name: "BMW 540i / 540i xDrive (G30)",
    why: "B58 inline-6 is one of the most reliable modern BMW engines. Still feels current and premium.",
    tags: ["sedan", "awd", "i6", "reliability", "value", "2018"]
  },
  {
    name: "Lexus LS 500",
    why: "Twin-turbo V6, extremely reliable, big depreciation from original sticker. Quiet flagship feel.",
    tags: ["sedan", "awd", "v6", "reliability", "comfort", "2018"]
  },
  {
    name: "Genesis G80 3.5T",
    why: "Strong value, modern interior, good reliability, and twin-turbo V6 power without German maintenance costs.",
    tags: ["sedan", "awd", "v6", "value", "2021"]
  },
  {
    name: "Audi A6 / A7 3.0T",
    why: "Solid 3.0T V6, nice highway manners. Secondary pick if the others don't fit.",
    tags: ["sedan", "coupe", "awd", "v6", "2019"]
  }
];

let current = 0;
let answers = [];

function showQuestion() {
  const q = questions[current];
  document.getElementById('question').textContent = q.q;
  const opts = document.getElementById('options');
  opts.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = opt;
    btn.onclick = () => select(i);
    opts.appendChild(btn);
  });
  document.getElementById('progress').style.width = ((current / questions.length) * 100) + '%';
}

function select(i) {
  answers.push(i);
  current++;
  if (current < questions.length) {
    showQuestion();
  } else {
    showResults();
  }
}

function showResults() {
  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('results').classList.remove('hidden');
  document.getElementById('progress').style.width = '100%';

  // Simple scoring
  const scored = cars.map(car => {
    let score = 0;
    // Budget is open for now
    if (answers[1] === 0 && car.tags.includes('sedan')) score += 2;
    if (answers[1] === 1 && car.tags.includes('coupe')) score += 2;
    if (answers[2] === 0 && car.tags.includes('awd')) score += 2;
    if (answers[3] === 0 && (car.tags.includes('i6') || car.tags.includes('v6'))) score += 2;
    if (answers[4] === 0 && car.tags.includes('value')) score += 3;
    if (answers[4] === 1 && car.tags.includes('reliability')) score += 3;
    if (answers[4] === 2 && car.tags.includes('comfort')) score += 2;
    if (answers[7] === 0 && car.tags.includes('2021')) score += 2;
    return { ...car, score };
  }).sort((a, b) => b.score - a.score).slice(0, 4);

  const list = document.getElementById('results-list');
  list.innerHTML = '';
  scored.forEach(car => {
    const div = document.createElement('div');
    div.className = 'result-card';
    div.innerHTML = `<h3>${car.name}</h3><p>${car.why}</p>`;
    list.appendChild(div);
  });
}

function restart() {
  current = 0;
  answers = [];
  document.getElementById('quiz').classList.remove('hidden');
  document.getElementById('results').classList.add('hidden');
  showQuestion();
}

showQuestion();
</script>
</body>
</html>
