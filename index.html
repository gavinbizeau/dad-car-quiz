<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dad's Luxury Car Quiz</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f0f; color: #fff; margin: 0; padding: 0; line-height: 1.5; }
  .top-bar { display: flex; align-items: center; padding: 16px 20px; background: #1a1a1a; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 10; }
  .menu-btn { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; padding: 4px 8px; }
  .title { font-size: 18px; font-weight: 600; margin-left: 12px; }
  .container { max-width: 520px; margin: 0 auto; padding: 20px; }
  .progress { height: 4px; background: #333; border-radius: 2px; margin-bottom: 20px; }
  .progress-bar { height: 100%; background: #0066cc; width: 0%; transition: width 0.3s; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  .subtitle { color: #aaa; margin-bottom: 24px; font-size: 14px; }
  .question { font-size: 20px; margin-bottom: 20px; }
  .options { display: flex; flex-direction: column; gap: 12px; }
  button, .option { background: #2a2a2a; border: 1px solid #333; color: #fff; padding: 16px; border-radius: 12px; font-size: 16px; cursor: pointer; text-align: left; transition: all 0.2s; }
  button:hover, .option:hover { background: #333; border-color: #555; }
  button.primary { background: #0066cc; border-color: #0066cc; font-weight: 600; }
  .result-card { background: #222; border-radius: 12px; padding: 16px; margin-bottom: 16px; border-left: 4px solid #0066cc; cursor: pointer; }
  .result-card h3 { margin: 0 0 8px; font-size: 18px; }
  .result-card p { margin: 0; color: #ccc; font-size: 14px; }
  .hidden { display: none; }
  .restart { margin-top: 20px; width: 100%; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 20; display: none; }
  .overlay.open { display: block; }
  .sidebar { position: fixed; top: 0; left: 0; width: 320px; height: 100%; background: #1a1a1a; z-index: 21; transform: translateX(-100%); transition: transform 0.3s; padding: 20px; overflow-y: auto; }
  .sidebar.open { transform: translateX(0); }
  .sidebar h3 { margin: 0 0 16px; font-size: 18px; }
  .car-link { display: block; padding: 14px 12px; background: #2a2a2a; border-radius: 10px; margin-bottom: 10px; cursor: pointer; font-size: 14px; }
  .car-link:hover { background: #333; }
  .close-menu { background: none; border: none; color: #aaa; font-size: 20px; float: right; cursor: pointer; }
  .detail-view { display: none; }
  .detail-view.active { display: block; }
  .detail-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .back-btn { background: #2a2a2a; border: 1px solid #333; color: #fff; padding: 8px 14px; border-radius: 8px; cursor: pointer; }
  .car-detail { background: #1a1a1a; border-radius: 16px; padding: 20px; }
  .car-detail h2 { margin: 0 0 8px; }
  .badge { display: inline-block; background: #0066cc; color: #fff; padding: 4px 10px; border-radius: 20px; font-size: 12px; margin-right: 6px; margin-bottom: 8px; }
  .section { margin-top: 20px; }
  .section h4 { margin: 0 0 10px; color: #0066cc; }
  .package-list { list-style: none; padding: 0; }
  .package-list li { background: #222; padding: 12px; border-radius: 8px; margin-bottom: 8px; }
  .gen-box { background: #222; padding: 12px; border-radius: 8px; margin-top: 8px; font-size: 14px; }
</style>
</head>
<body>
<div class="top-bar">
  <button class="menu-btn" onclick="openMenu()">☰</button>
  <div class="title">Luxury Car Quiz</div>
</div>
<div class="overlay" id="overlay" onclick="closeMenu()"></div>
<div class="sidebar" id="sidebar">
  <button class="close-menu" onclick="closeMenu()">✕</button>
  <h3>All Cars (15 per type)</h3>
  <div id="car-menu"></div>
</div>
<div class="container">
  <div class="progress"><div class="progress-bar" id="progress"></div></div>
  <h1>Find Your Next Luxury Car</h1>
  <p class="subtitle">Quick quiz for a reliable, modern-feeling luxury car with strong value. 15 options each for sedan, coupe, and SUV.</p>
  <div id="quiz">
    <div class="question" id="question">Loading...</div>
    <div class="options" id="options"></div>
  </div>
  <div id="results" class="hidden">
    <h2>Your Top Matches</h2>
    <div id="results-list"></div>
    <button class="primary restart" onclick="restart()">Start Over</button>
  </div>
  <div id="detail" class="detail-view">
    <div class="detail-header">
      <button class="back-btn" onclick="closeDetail()">← Back</button>
    </div>
    <div id="detail-content" class="car-detail"></div>
  </div>
</div>

const cars = [

  { name: "BMW 540i / 540i xDrive (G30)", generation: "G30 (2017–2023) — prefer 2021+ LCI", why: "B58 is one of BMW’s most reliable modern engines.", tags: ["sedan","awd","i6","reliability","value","2018"], engine: "3.0L B58 turbo I6 (335–375 hp)", packages: ["M Sport","Driving Assistance Pro","Premium","Executive"], notes: "Prefer 2021+ for mild-hybrid and refreshed interior." },
  { name: "BMW M340i xDrive", generation: "G20 (2019–present)", why: "B58 in a more agile, modern chassis. Excellent daily + fun balance.", tags: ["sedan","awd","i6","reliability","value","2020"], engine: "3.0L B58 turbo I6 (382–386 hp)", packages: ["M Sport","Premium Package","Driving Assistance"], notes: "One of the best B58 applications available." },
  { name: "Lexus LS 500", generation: "XF50 (2018–present)", why: "Twin-turbo V6, extremely reliable, big depreciation.", tags: ["sedan","awd","v6","reliability","comfort","2018"], engine: "3.5L twin-turbo V6 (416 hp)", packages: ["Luxury/Executive","Air suspension","Mark Levinson"], notes: "Quiet flagship with heavy residual drop from high stickers." },
  { name: "Genesis G80 3.5T", generation: "2nd gen (2021–present)", why: "Modern redesign, strong value, twin-turbo V6, great warranty.", tags: ["sedan","awd","v6","value","2021"], engine: "3.5L twin-turbo V6 (375 hp)", packages: ["Advanced or Prestige","Nappa ventilated seats","Lexicon"], notes: "Look for loaded trims. Best pure value in segment." },

  { name: "Lexus ES 350 / 300h", generation: "XZ10 (2019–present)", why: "Extremely reliable midsize luxury sedan with excellent residual and comfort.", tags: ["sedan","awd","v6","reliability","comfort","value"], engine: "3.5L V6 or hybrid", packages: ["Luxury","Ultra Luxury","Mark Levinson"], notes: "One of the most reliable luxury sedans. Hybrid for efficiency." },

  { name: "Lexus RX 350 / 350h", generation: "AL20 (2016–2022) last NA V6 gen", why: "Extremely reliable V6. Quiet, comfortable, strong residual.", tags: ["suv","awd","v6","reliability","comfort","value"], engine: "3.5L NA V6 (295 hp) or hybrid", packages: ["Luxury","F Sport","Mark Levinson"], notes: "Prefer 2020+ for better tech. One of the safest long-term luxury SUVs." },
  { name: "Lexus GX 460", generation: "J150 (2010–2023)", why: "Bulletproof V8 body-on-frame luxury SUV.", tags: ["suv","awd","v8","reliability","comfort"], engine: "4.6L V8 (301 hp)", packages: ["Luxury","Premium","Off-road"], notes: "Nearly indestructible. Excellent residual. Prefer 2014+ updates." },
  { name: "Lexus LX 570 / 600", generation: "URJ200 / J300", why: "Flagship body-on-frame. Extremely reliable and holds value.", tags: ["suv","awd","v8","reliability","comfort"], engine: "5.7L V8 or newer twin-turbo V6", packages: ["Luxury","Executive"], notes: "High residual. High fuel use but tank-like durability." },

  { name: "Genesis GV80 3.5T", generation: "1st gen (2021–present)", why: "Midsize luxury SUV with modern interior and strong value.", tags: ["suv","awd","v6","value","comfort","2021"], engine: "3.5L twin-turbo V6 (375 hp)", packages: ["Advanced","Prestige","Air suspension"], notes: "Loaded trims feel premium. Good residual vs German rivals." },
  { name: "BMW X5 xDrive40i (G05)", generation: "G05 (2019–present)", why: "B58 power in a refined midsize luxury SUV.", tags: ["suv","awd","i6","reliability","value"], engine: "3.0L B58 turbo I6", packages: ["M Sport","Premium","Driving Assistance Pro"], notes: "B58 is excellent. Watch early transfer case and cooling items." },
  { name: "BMW X3 M40i", generation: "G01 (2018–2024)", why: "Compact SUV with excellent B58. Fun and reliable.", tags: ["suv","awd","i6","reliability","value"], engine: "3.0L B58 turbo I6", packages: ["M Sport","Premium"], notes: "One of the best B58 SUVs for value and driving." },
  { name: "Mercedes GLE 450", generation: "V167 (2020–present)", why: "M256 inline-6 in a comfortable midsize SUV.", tags: ["suv","awd","i6","comfort","value","2021"], engine: "3.0L M256 I6 mild-hybrid", packages: ["AMG Line","Driver Assistance","Air suspension"], notes: "Prefer 2021+. Check air suspension service history." },
  { name: "Lexus NX 350 / 350h", generation: "AZ20 (2022–present)", why: "Modern compact luxury SUV with reliable powertrains.", tags: ["suv","awd","v6","reliability","value"], engine: "2.4L turbo or hybrid", packages: ["Luxury","F Sport","Premium"], notes: "Newer gen feels current. Strong reliability reputation." },
  { name: "Acura MDX", generation: "4th gen (2022–present)", why: "Reliable three-row luxury SUV with strong features and value.", tags: ["suv","awd","v6","reliability","value"], engine: "3.5L V6 or Type S turbo", packages: ["Technology","Advance","Type S"], notes: "Prefer 2022+ redesign. Excellent long-term ownership." },
  { name: "BMW X7 xDrive40i", generation: "G07 (2019–present)", why: "Full-size luxury SUV with B58. Comfortable and depreciates well.", tags: ["suv","awd","i6","comfort","value"], engine: "3.0L B58 turbo I6", packages: ["Executive","Premium","M Sport"], notes: "Big residual drop. B58 helps reliability. Prefer later years." },
  { name: "Mercedes GLS 450", generation: "X167 (2020–present)", why: "Full-size luxury SUV with M256. Quiet and spacious.", tags: ["suv","awd","i6","comfort","value"], engine: "3.0L M256 I6", packages: ["Premium","Driver Assistance","Air suspension"], notes: "Prefer post-2020. Check for air and electronics service." },
  { name: "Audi Q5 3.0T / SQ5", generation: "FY (2018–present)", why: "Compact luxury SUV with solid V6 and good tech.", tags: ["suv","awd","v6","value"], engine: "3.0L turbo V6", packages: ["Premium Plus","Prestige"], notes: "SQ5 is the stronger engine. Service history important." },
  { name: "Porsche Cayenne (base/S)", generation: "E3 (2019–present)", why: "Sporty luxury SUV with strong residual and solid engines.", tags: ["suv","awd","v6","value"], engine: "3.0L turbo V6 or higher", packages: ["Premium","Sport Chrono"], notes: "Strong residual for the class. Prefer well-maintained examples." },
  { name: "Infiniti QX60 / QX80", generation: "Current gens", why: "Comfortable luxury SUVs with proven V6/V8 and value.", tags: ["suv","awd","v6","v8","value","comfort"], engine: "V6 or V8 options", packages: ["Luxe","Sensory","Autograph"], notes: "QX80 has strong residual. Good for family use." },

  // ========== COUPES (15) ==========
  { name: "BMW 840i xDrive", generation: "G15 (2019–present)", why: "Grand tourer coupe with reliable B58 and strong depreciation.", tags: ["coupe","awd","i6","value","comfort"], engine: "3.0L B58 turbo I6", packages: ["M Sport","Premium","Driving Assistance"], notes: "Prefer B58 over V8 for reliability. Excellent cruiser." },
  { name: "BMW M440i xDrive", generation: "G22 (2021–present)", why: "Modern coupe with B58. Sporty yet refined.", tags: ["coupe","awd","i6","reliability","value","2021"], engine: "3.0L B58 turbo I6 (382 hp)", packages: ["M Sport","Premium"], notes: "Current-gen 4 Series. Excellent B58 application." },
  { name: "Lexus RC 350 / RC F", generation: "XC10", why: "Reliable V6 or V8 coupe. Low-drama ownership.", tags: ["coupe","awd","v6","v8","reliability"], engine: "3.5L V6 or 5.0L V8", packages: ["F Sport","Luxury"], notes: "Very reliable. RC F for the bulletproof V8." },
  { name: "Audi A5 / S5 Coupe or Sportback", generation: "B9 (2018–2024)", why: "Stylish coupe with solid 3.0T and good features.", tags: ["coupe","awd","v6","value"], engine: "3.0L EA839 turbo V6", packages: ["Premium Plus","Prestige","B&O"], notes: "Sportback offers more practicality. Prestige is best." },
  { name: "Mercedes E450 Coupe", generation: "C238 (2018–2023) — prefer 2021+", why: "Luxury coupe with M256 on later years. Smooth and modern.", tags: ["coupe","awd","i6","value","comfort","2021"], engine: "3.0L M256 I6 mild-hybrid", packages: ["AMG Line","Premium","Driver Assistance"], notes: "2021+ for the new engine. Elegant grand tourer." },
  { name: "BMW 440i / 440i xDrive (F32/G22)", generation: "F32 (2014–2020) / G22", why: "Classic B58 coupe. Strong value on earlier years.", tags: ["coupe","awd","i6","reliability","value"], engine: "3.0L B58 turbo I6", packages: ["M Sport","Premium"], notes: "Prefer 2018+ F32 or G22. Excellent reliability with B58." },
  { name: "Lexus LC 500", generation: "URZ100 (2018–present)", why: "Stunning grand tourer with naturally aspirated V8. Extremely reliable.", tags: ["coupe","rwd","v8","reliability","comfort"], engine: "5.0L NA V8 (471 hp)", packages: ["Luxury","Sport","Mark Levinson"], notes: "One of the most reliable modern V8 coupes. Holds value well." },
  { name: "Audi S5 Coupe", generation: "B9", why: "Sportier version of A5 with stronger V6.", tags: ["coupe","awd","v6","value"], engine: "3.0L turbo V6 (~349 hp)", packages: ["Prestige","Adaptive suspension"], notes: "Better power than base A5. Full service history preferred." },
  { name: "Mercedes C300 / C43 Coupe", generation: "W205 (2015–2023)", why: "Compact luxury coupe with solid engines and depreciation.", tags: ["coupe","awd","i4","v6","value"], engine: "Turbo I4 or V6 AMG", packages: ["AMG Line","Premium"], notes: "C43 is more engaging. Prefer later years for reliability." },

  { name: "Audi TT / TTS", generation: "8S (2015–2023)", why: "Stylish small coupe with solid turbo engines.", tags: ["coupe","awd","i4","value"], engine: "2.0T or 2.5T", packages: ["Premium Plus","Virtual Cockpit"], notes: "TTS is more powerful. Fun daily with good residual." },
  { name: "Mercedes CLE Coupe", generation: "C236 (2024–present)", why: "New generation coupe with modern tech and solid power.", tags: ["coupe","awd","i6","value","2024"], engine: "Inline-6 options", packages: ["AMG Line","Premium"], notes: "Very new — limited used data but modern and refined." },
  { name: "Genesis G70 Coupe? / G70 sedan sporty", generation: "Current", why: "Sporty luxury with strong V6 and value (if coupe not available, high-spec sedan).", tags: ["coupe","sedan","awd","v6","value"], engine: "3.3L twin-turbo V6", packages: ["Sport Prestige"], notes: "G70 is primarily sedan but highly sporty. Strong warranty." },
  { name: "BMW Z4 M40i", generation: "G29 (2019–present)", why: "Open-top grand tourer with B58. Fun and reliable.", tags: ["coupe","rwd","i6","reliability","value"], engine: "3.0L B58 turbo I6", packages: ["M Sport","Premium"], notes: "Roadster version of B58. Excellent for fair-weather enjoyment." }
];

let current = 0;
let answers = [];

function openMenu() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('overlay').classList.add('open');
}
function closeMenu() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}

function buildMenu() {
  const menu = document.getElementById('car-menu');
  menu.innerHTML = '';
  cars.forEach((car, i) => {
    const div = document.createElement('div');
    div.className = 'car-link';
    div.textContent = car.name;
    div.onclick = () => { closeMenu(); showDetail(i); };
    menu.appendChild(div);
  });
}

function showDetail(index) {
  const car = cars[index];
  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('results').classList.add('hidden');
  document.getElementById('detail').classList.add('active');
  const content = document.getElementById('detail-content');
  content.innerHTML = `
    <h2>${car.name}</h2>
    <div class="gen-box"><strong>Generation:</strong> ${car.generation}</div>
    <div style="margin-top:12px;">${car.tags.map(t => `<span class="badge">${t}</span>`).join('')}</div>
    <p style="color:#ccc; margin-top:12px;">${car.why}</p>
    <div class="section">
      <h4>Engine</h4>
      <p>${car.engine}</p>
    </div>
    <div class="section">
      <h4>Top Packages to Look For</h4>
      <ul class="package-list">${car.packages.map(p => `<li>${p}</li>`).join('')}</ul>
    </div>
    <div class="section">
      <h4>Diligence Notes</h4>
      <p>${car.notes}</p>
    </div>
  `;
}

function closeDetail() {
  document.getElementById('detail').classList.remove('active');
  if (answers.length === questions.length) {
    document.getElementById('results').classList.remove('hidden');
  } else {
    document.getElementById('quiz').classList.remove('hidden');
  }
}

function showQuestion() {
  const q = questions[current];
  document.getElementById('question').textContent = q.q;
  const opts = document.getElementById('options');
  opts.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = opt;
    btn.onclick = () => select(i);
    opts.appendChild(btn);
  });
  document.getElementById('progress').style.width = ((current / questions.length) * 100) + '%';
}

function select(i) {
  answers.push(i);
  current++;
  if (current < questions.length) {
    showQuestion();
  } else {
    showResults();
  }
}

function showResults() {
  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('results').classList.remove('hidden');
  document.getElementById('progress').style.width = '100%';

  const scored = cars.map(car => {
    let score = 0;
    if (answers[1] === 0 && car.tags.includes('sedan')) score += 3;
    if (answers[1] === 1 && car.tags.includes('coupe')) score += 3;
    if (answers[1] === 2 && car.tags.includes('suv')) score += 3;
    if (answers[2] === 0 && car.tags.includes('awd')) score += 2;
    if (answers[3] === 0 && (car.tags.includes('i6') || car.tags.includes('v6'))) score += 2;
    if (answers[3] === 1 && car.tags.includes('v8')) score += 2;
    if (answers[4] === 0 && car.tags.includes('value')) score += 3;
    if (answers[4] === 1 && car.tags.includes('reliability')) score += 3;
    if (answers[4] === 2 && car.tags.includes('comfort')) score += 2;
    if (answers[7] === 0 && car.tags.includes('2021')) score += 2;
    return { ...car, score };
  }).sort((a, b) => b.score - a.score).slice(0, 5);

  const list = document.getElementById('results-list');
  list.innerHTML = '';
  scored.forEach((car) => {
    const realIndex = cars.findIndex(c => c.name === car.name);
    const div = document.createElement('div');
    div.className = 'result-card';
    div.innerHTML = `<h3>${car.name}</h3><p>${car.why}</p>`;
    div.onclick = () => showDetail(realIndex);
    list.appendChild(div);
  });
}

function restart() {
  current = 0;
  answers = [];
  document.getElementById('quiz').classList.remove('hidden');
  document.getElementById('results').classList.add('hidden');
  document.getElementById('detail').classList.remove('active');
  showQuestion();
}

buildMenu();
showQuestion();
</script>
</body>
